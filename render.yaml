services:
  - type: web
    name: qr-scan-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn Counter:app --host 0.0.0.0 --port $PORT
    envVars:
      PUBLIC_BASE_URL: ${RENDER_EXTERNAL_URL}
      DB_FILE: /data/qr_counter.db
    disk:
      name: qr-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /healthz